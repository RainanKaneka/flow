name: Build Flow Desktop Setup (.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build Windows Desktop App
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Bundle
        run: npm run build

      - name: Build Tauri Desktop Installer
        run: npx tauri build --verbose

      - name: Upload Windows Setup Artifact (.exe / .msi)
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Windows-Setup-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/flow.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Publish to GitHub Releases (Direct One-Click .exe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Flow Desktop v0.1.0
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/flow.exe
          body: |
            ## 🌊 Flow — Instalador Desktop Oficial para Windows

            Baixe o instalador `.exe` direto abaixo (sem precisar extrair nada, apenas dê dois cliques para instalar):

            - 🚀 **`Flow_0.1.0_x64-setup.exe`** (Instalador recomendado com assistente e atalhos na Área de Trabalho)
            - 📦 **`Flow_0.1.0_x64_en-US.msi`** (Pacote MSI corporativo)
            - ⚡ **`flow.exe`** (Executável portátil standalone)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
