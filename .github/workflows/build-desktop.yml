name: Build Flow Desktop Setup

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build Windows Desktop App
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -ne $packageVersion) { throw "App and installer versions differ" }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag differs from installer version" }
          }
          if (-not (Test-Path -LiteralPath "docs/releases/v$version.md")) { throw "Release notes are missing" }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "RELEASE_NAME=Flow Desktop v$version" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Test application
        run: npm test

      - name: Build desktop installers
        run: npx tauri build --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Windows-Setup-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/flow.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: "github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: Flow '))"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/flow.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
