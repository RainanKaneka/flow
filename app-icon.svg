<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312E81" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Stylized Geometric Flow Waves ("F" & Wave Stream) -->
  <g filter="url(#shadow)">
    <!-- Top Horizontal Bar -->
    <path d="M 148 160 C 148 144, 160 132, 176 132 L 348 132 C 364 132, 376 144, 376 160 C 376 176, 364 188, 348 188 L 176 188 C 160 188, 148 176, 148 160 Z" fill="url(#waveGrad)"/>
    
    <!-- Middle Flowing Stream Wave -->
    <path d="M 148 256 C 148 240, 160 228, 176 228 L 308 228 C 324 228, 336 240, 336 256 C 336 272, 324 284, 308 284 L 176 284 C 160 284, 148 272, 148 256 Z" fill="url(#waveGrad)"/>
    
    <!-- Vertical Spine Pillar -->
    <path d="M 148 160 L 148 356 C 148 372, 160 384, 176 384 C 192 384, 204 372, 204 356 L 204 160 Z" fill="url(#waveGrad)"/>

    <!-- Sparkle Diamond Anchor -->
    <path d="M 336 348 C 336 332, 348 320, 364 320 C 380 320, 392 332, 392 348 C 392 364, 380 376, 364 376 C 348 376, 336 364, 336 348 Z" fill="#38BDF8"/>
  </g>
</svg>
